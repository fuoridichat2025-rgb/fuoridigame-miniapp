*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif
}

h1,h2,h3,.display{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif
}

button{
  font-family:inherit;
  touch-action:manipulation
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-6px) rotate(2deg)
  }
}

@keyframes pop{
  0%{
    transform:scale(.92)
  }

  60%{
    transform:scale(1.04)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes shine{
  0%{
    transform:translateX(-120%) skewX(-18deg)
  }

  100%{
    transform:translateX(240%) skewX(-18deg)
  }
}

@keyframes reel{
  0%{
    transform:translateY(-8px)
  }

  50%{
    transform:translateY(8px)
  }

  100%{
    transform:translateY(-8px)
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(-10px) rotate(0)
  }

  100%{
    transform:translateY(220px) rotate(540deg);
    opacity:0
  }
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(212,175,55,.45)
  }

  50%{
    box-shadow:0 0 0 9px rgba(212,175,55,0)
  }
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.anim-float{
  animation:floaty 3.2s ease-in-out infinite
}

.anim-pop{
  animation:pop .35s ease
}

.anim-slide{
  animation:slideUp .35s ease
}

.anim-pulse-gold{
  animation:pulseGold 1.8s infinite
}

.reel-anim{
  animation:reel .18s infinite
}

.confetti{
  position:absolute;
  top:0;
  width:9px;
  height:14px;
  border-radius:2px;
  animation:confettiFall 1.4s ease-in forwards;
  pointer-events:none
}

.shine{
  position:relative;
  overflow:hidden
}

.shine:after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:45%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shine 2.8s ease-in-out infinite
}

.card-flip{
  perspective:900px
}

.card-inner{
  transition:transform .6s cubic-bezier(.2,.8,.2,1);
  transform-style:preserve-3d;
  position:relative;
  width:100%;
  height:100%
}

.card-inner.flipped{
  transform:rotateY(180deg)
}

.card-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
